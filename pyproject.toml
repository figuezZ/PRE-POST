[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-post-iciv1042"
version = "0.2.0"
description = "Herramienta academica para una viga de hormigon pretensado"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Academic use only"}
authors = [{name = "Equipo ICIV 1042"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
app = ["streamlit>=1.36"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
